name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: read

# One deploy at a time; never cancel an in-flight SVN commit.
concurrency:
  group: wporg-deploy
  cancel-in-progress: false

# The tree bin/build.sh leaves; the 10up action reads BUILD_DIR from the environment.
env:
  BUILD_DIR: dist/woocommerce-parcelas

jobs:
  # WHY two jobs: npm and Composer install scripts run third-party code, and a step can
  # rewrite every later step's PATH and env (GITHUB_PATH, GITHUB_ENV). The build runs in
  # a job without the SVN credentials; the job that holds them runs no installed code.
  build:
    name: Build
    runs-on: ubuntu-latest
    # `published` also fires for pre-releases — never ship those to wp.org.
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v5

      # WP-CLI: npm run build compiles the translations (bin/i18n.sh build).
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium
          coverage: none
          tools: composer:v2, wp-cli

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # bin/build.sh owns the build and the .distignore filtering.
      - run: bin/build.sh --no-restore

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: ${{ env.BUILD_DIR }}
          # GOTCHA: the plugin reads public/build/.vite/manifest.json at runtime, and
          # hidden files are left out of an artifact by default.
          include-hidden-files: true

  deploy:
    name: Deploy to WordPress.org
    needs: build
    runs-on: ubuntu-latest
    # The SVN credentials are this environment's secrets, not the repository's, so no
    # other job (the E2E job reads every secret it can) ever sees them.
    environment: wporg
    steps:
      # The action reads ASSETS_DIR from the checkout.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The GitHub repo name may differ from the wp.org slug; without SLUG the
          # action would default to the repo name and hit the wrong SVN URL.
          SLUG: woocommerce-parcelas
          # Assets live at .wordpress-org/assets/, one level below the action's
          # default ASSETS_DIR (.wordpress-org). Without this the action mirrors
          # .wordpress-org/ itself: it nests the images as assets/assets/, so the
          # banner/icon go missing on the plugin page, and it publishes
          # .wordpress-org/README.md. bin/check-wporg-assets.sh vets this same
          # folder, so change both together.
          ASSETS_DIR: .wordpress-org/assets
          # VERSION is intentionally not set: the action derives it from the
          # release tag and strips a leading "v" (v1.2.3 -> 1.2.3).
